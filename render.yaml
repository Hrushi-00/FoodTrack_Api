services:
  - type: web
    name: food-track-backend
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: FRONTEND_URL
        sync: false
